# Blueprint Render: Static Site
# PUBLIC_SITE_URL define el dominio para sitemap/canonicals. Queda fijado al
# dominio público real; si el servicio cambia de dominio, actualizarlo aquí o
# sobreescribirlo en Render → Environment. (El astro.config además tiene este
# mismo valor como fallback: nunca se publica localhost.)
services:
  - type: web
    name: factutas-consulta
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: PUBLIC_SITE_URL
        value: https://consultas.mallki-facturas.cloud
